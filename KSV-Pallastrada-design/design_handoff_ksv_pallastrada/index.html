<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>KSV Pallastrada — Visual Design</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #E7E2D6; font-family: 'Inter', sans-serif; }
    * { box-sizing: border-box; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="system.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-football.jsx"></script>
  <script type="text/babel" src="screen-tournament.jsx"></script>
  <script type="text/babel" src="screen-contact.jsx"></script>
  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="system" title="01 — Système" subtitle="Palette, type, composants. La grammaire du club.">
            <DCArtboard id="design-system" label="Design System" width={1440} height={2200}>
              <DesignSystem />
            </DCArtboard>
          </DCSection>

          <DCSection id="home" title="02 — Accueil" subtitle="Page d'accueil — hero, clubs, bannière tournoi.">
            <DCArtboard id="home-desktop" label="Home · Desktop · 1440" width={1440} height={3400}>
              <HomeDesktop />
            </DCArtboard>
            <DCArtboard id="home-mobile" label="Home · Mobile · 390" width={390} height={2200}>
              <HomeMobile />
            </DCArtboard>
          </DCSection>

          <DCSection id="football" title="03 — Football" subtitle="Page de club. Histoire, équipes, calendrier.">
            <DCArtboard id="football-desktop" label="Football · Desktop · 1440" width={1440} height={2400}>
              <FootballDesktop />
            </DCArtboard>
            <DCArtboard id="football-mobile" label="Football · Mobile · 390" width={390} height={1700}>
              <FootballMobile />
            </DCArtboard>
          </DCSection>

          <DCSection id="tournament" title="04 — Tournoi · Live" subtitle="Tableau de bord en direct. Sombre, contraste, pulse.">
            <DCArtboard id="tournament-desktop" label="Tournament · Desktop · 1440" width={1440} height={2900}>
              <TournamentDesktop />
            </DCArtboard>
            <DCArtboard id="tournament-mobile" label="Tournament · Mobile · 390" width={390} height={1700}>
              <TournamentMobile />
            </DCArtboard>
          </DCSection>

          <DCSection id="contact" title="05 — Contact" subtitle="Formulaire, coordonnées, plan.">
            <DCArtboard id="contact-desktop" label="Contact · Desktop · 1440" width={1440} height={2000}>
              <ContactDesktop />
            </DCArtboard>
            <DCArtboard id="contact-mobile" label="Contact · Mobile · 390" width={390} height={1900}>
              <ContactMobile />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
